[build]
  command = "pnpm install --frozen-lockfile --prefer-offline=false && pnpm --filter @brugulacivica/dashboard build"
  publish = "apps/dashboard/dist"
  base = "apps/dashboard"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.0"
  NETLIFY_CACHE_BUST = "2026-10-10-14"
  # Force clean install
  PNPM_FLAGS = "--no-optional --frozen-lockfile --prefer-offline=false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
