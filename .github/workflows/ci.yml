name: CI

# CivicSys CI — evidence-first (RFC CIVICSYS-ARCH-001 §10):
# a change is mergeable only when contracts compile to wasm, all tests pass,
# clippy -D warnings is clean, the deployment record still verifies against
# the artifacts, and (separately) the deployed contracts answer live on testnet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts — fmt, clippy, tests, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version that produced deployments/testnet.json so the
      # wasm sha256 is reproducible (RFC §9). Bump deliberately, then re-run
      # scripts/deploy-testnet.sh and commit the new evidence.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI (official release)
        run: |
          VER=$(curl -s https://api.github.com/repos/stellar/stellar-cli/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -sSfL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${VER}/stellar-cli-${VER}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract tests
        run: cargo test
      - name: Build wasm artifacts
        run: stellar contract build
      - name: Artifact hashes
        run: sha256sum target/wasm32v1-none/release/*.wasm
      - name: Verify deployment record against local artifacts (RFC §9/§10)
        run: ./scripts/verify-deployment.sh deployments/testnet.json
      - uses: actions/upload-artifact@v4
        with:
          name: civicsys-wasm
          path: target/wasm32v1-none/release/*.wasm

  sdk-and-dashboard:
    name: SDK + dashboard — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (sdk + dashboard)
        run: pnpm -r typecheck
      - name: SDK unit tests (offline, pure verifier logic)
        run: pnpm --filter @civicsys/sdk test
      - name: Build sdk
        run: pnpm --filter @civicsys/sdk build
      - name: Build dashboard
        run: pnpm --filter @civicsys/dashboard build

  testnet-live:
    name: Live testnet — deployment evidence + fail-closed reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Stellar CLI (official release)
        run: |
          VER=$(curl -s https://api.github.com/repos/stellar/stellar-cli/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -sSfL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${VER}/stellar-cli-${VER}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
          stellar --version
      - run: pnpm install --frozen-lockfile
      - name: Verify deployment evidence live on-chain (contract answers)
        run: ./scripts/verify-deployment.sh deployments/testnet.json --live
      - name: SDK live reads (fail-closed behavior against real contracts)
        run: pnpm --filter @civicsys/sdk test:live
