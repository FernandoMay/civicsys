name: CI

# Brújula Cívica CI — evidence-first (RFC BRUJULA-CIVICA-ARCH-001 §10):
# a change is mergeable only when contracts compile to wasm, all tests pass,
# clippy -D warnings is clean, the deployment record still verifies against
# the artifacts, the dashboard builds, and (separately) the deployed contracts
# answer live on testnet.
#
# Toolchains are PINNED to the exact versions that produced the wasm sha256
# recorded in deployments/testnet.json (RFC §9). Bumping either one invalidates
# that evidence and requires re-running scripts/deploy-testnet.sh and
# re-committing the record. "latest" would break reproducibility silently.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RUST_VERSION: "1.99.0"
  STELLAR_VERSION: "28.1.0"

jobs:
  contracts:
    name: Contracts — fmt, clippy, tests, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract tests
        run: cargo test --workspace
      - name: Build wasm artifacts
        run: stellar contract build
      - name: Artifact hashes
        run: sha256sum target/wasm32v1-none/release/*.wasm
      - name: Verify deployment record against local artifacts (RFC §9/§10)
        run: ./scripts/verify-deployment.sh deployments/testnet.json
      - uses: actions/upload-artifact@v4
        with:
          name: brugulacivica-wasm
          path: target/wasm32v1-none/release/*.wasm

  sdk:
    name: SDK — typecheck, offline tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brugulacivica/sdk typecheck
      - name: SDK unit tests (offline: verifier, normalisers, hashing, membership)
        run: pnpm --filter @brugulacivica/sdk test
      - name: Build sdk
        run: pnpm --filter @brugulacivica/sdk build

  hermes:
    name: Hermes — canonical JSON, retrieval, rules, hashing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brugulacivica/sdk build
      - run: pnpm --filter @brugulacivica/hermes typecheck
      - name: Hermes tests (real HTTP retrieval, determinism, fail-closed rules)
        run: pnpm --filter @brugulacivica/hermes test
      - name: Build hermes
        run: pnpm --filter @brugulacivica/hermes build

  dashboard:
    name: Dashboard — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brugulacivica/sdk build
      - run: pnpm --filter @brugulacivica/hermes build
      - run: pnpm --filter @brugulacivica/dashboard typecheck
      - name: Dashboard tests (fail-closed rendering, wallet boundary, commitments)
        run: pnpm --filter @brugulacivica/dashboard test
      - name: Build dashboard
        run: pnpm --filter @brugulacivica/dashboard build

  testnet-live:
    name: Live testnet — deployment evidence + fail-closed reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Stellar CLI (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
          stellar --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brugulacivica/sdk build
      - name: Verify deployment evidence live on-chain (contract answers)
        run: ./scripts/verify-deployment.sh deployments/testnet.json --live
      - name: SDK live reads (fail-closed behavior against real contracts)
        run: pnpm --filter @brugulacivica/sdk test:live
      - name: Neighbor funding evidence (Horizon, fail-closed)
        run: pnpm --filter @brugulacivica/sdk test:funding