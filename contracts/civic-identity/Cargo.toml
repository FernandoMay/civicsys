[package]
name = "civic-identity"
version = "0.1.0"
edition = "2021"
publish = false
description = "CivicSys credential commitments, eligibility and revocation (RFC CIVICSYS-ARCH-001 §3.1)"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
